name: Agent Runtime
on:
  push:
    branches: [main]
    paths:
      - "astrologically_intelligent/**"
      - "skills/**"
      - "upstream/**"
      - "scripts/**"
      - "tests/**"
      - ".gitmodules"
      - "README.md"
      - "AGENT_RUNTIME.md"
      - "UPSTREAM_IMPORT.md"
      - "tests/test_agent_runtime.py"
      - "README.md"
      - "AGENT_RUNTIME.md"
      - "UPSTREAM_IMPORT.md"
      - ".github/workflows/agent-runtime.yml"
  pull_request:
    paths:
      - "astrologically_intelligent/**"
      - "tests/test_agent_runtime.py"
      - ".github/workflows/agent-runtime.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize skill-source submodules
        run: git submodule update --init --depth 1 -- skills/upstream/anthropics-skills skills/upstream/openai-skills skills/upstream/n8n-skills skills/upstream/hermes-agent skills/upstream/openclaw-agent-skills
      - name: Run agent runtime tests
        run: python -m unittest discover -s tests -v
