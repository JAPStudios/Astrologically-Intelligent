name: Agent Runtime
on:
  push:
    branches: [main]
    paths:
      - "astrologically_intelligent/**"
      - "skills/**"
      - "upstream/**"
      - "scripts/**"
      - "tests/**"
      - ".gitmodules"
      - "README.md"
      - "AGENT_RUNTIME.md"
      - "UPSTREAM_IMPORT.md"
      - "tests/test_agent_runtime.py"
      - "README.md"
      - "AGENT_RUNTIME.md"
      - "UPSTREAM_IMPORT.md"
      - ".github/workflows/agent-runtime.yml"
  pull_request:
    paths:
      - "astrologically_intelligent/**"
      - "tests/test_agent_runtime.py"
      - ".github/workflows/agent-runtime.yml"
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Initialize skill-source submodules
        run: git submodule update --init --depth 1 -- skills/upstream/anthropics-skills skills/upstream/openai-skills skills/upstream/n8n-skills skills/upstream/hermes-agent skills/upstream/openclaw-agent-skills
      - name: Run agent runtime tests
        run: python -m unittest discover -s tests -v
