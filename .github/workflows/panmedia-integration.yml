name: PanMedia Integration

on:
  push:
    branches: [main]
    paths:
      - "astrologically_intelligent/**"
      - ".github/workflows/panmedia-integration.yml"
  pull_request:
    paths:
      - "astrologically_intelligent/**"
      - ".github/workflows/panmedia-integration.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: panmedia-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panmedia-backend:
    name: PanMedia against the Astrologically Intelligent runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Astrologically Intelligent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Astrologically-Intelligent
          persist-credentials: false

      - name: Check out PanMedia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JAPStudios/PanMedia
          path: PanMedia
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Exercise the real runtime through the PanMedia proxy
        working-directory: PanMedia
        env:
          ASTRO_AI_REPO_PATH: ${{ github.workspace }}/Astrologically-Intelligent
        run: python -m unittest discover -s tests -p "test_live_backend_integration.py" -v
