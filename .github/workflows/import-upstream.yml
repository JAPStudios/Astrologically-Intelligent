name: Import Upstream Repositories
on:
  push:
    branches: [main]
    paths:
      - "scripts/import_upstream_orgs.py"
      - ".github/workflows/import-upstream.yml"
  workflow_dispatch:
permissions: {}
concurrency:
  group: upstream-import-main
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Import requested upstream repositories in resumable batches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          batch=0
          while true; do
            batch=$((batch + 1))
            echo "Starting upstream import batch ${batch}"
            output="$(python scripts/import_upstream_orgs.py --limit 25 \
              --org anthropics \
              --org herdrdev \
              --org n8n-io \
              --org NousResearch \
              --org odysseus-dev \
              --org openai \
              --org openclaw \
              --org paperclipai \
              --org perplexityai \
              --org xai-org)"
            echo "$output"
            added="$(printf '%s\n' "$output" | sed -n 's/^IMPORT_ADDED=\([0-9][0-9]*\).*/\1/p' | tail -n 1)"
            if [[ -z "$added" ]]; then
              echo "Importer did not report its batch result." >&2
              exit 1
            fi
            if [[ "$added" -eq 0 ]]; then
              echo "All discoverable public repositories are already represented as submodules."
              break
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .gitmodules
            base="$(git rev-parse HEAD)"
            git commit -s -m "Import upstream repository batch ${batch}"
            git -c http.https://github.com/.extraheader="$auth_header" fetch origin main
            remote="$(git rev-parse origin/main)"
            if [[ "$remote" != "$base" ]]; then
              echo "main advanced during this batch; retrying against the latest main."
              git reset --hard origin/main
              continue
            fi
            git -c http.https://github.com/.extraheader="$auth_header" push origin HEAD:main
          done
