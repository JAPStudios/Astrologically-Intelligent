name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Android manifest XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('AndroidManifest.xml')"
      - name: Run Python runtime tests
        run: python -m unittest discover -s tests -v
