plugins {
    id "com.android.application" version "8.7.3"
}

android {
    namespace "com.japstudios.astrologicallyintelligent"
    compileSdk 35

    defaultConfig {
        applicationId "com.japstudios.astrologicallyintelligent"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
